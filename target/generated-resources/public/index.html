  <style type="text/css">

    body, html {
      height: 100%;
      overflow: hidden;
      background-color: #000000 !important;
    }

    .tb-loading-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      width: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1000;
    }

    .tb-loading-logo {
      width: 250px; /* Ajuste o tamanho da logo conforme necessário */
      height: auto;
      animation: tb-pulse-animation 2s infinite ease-in-out;
      margin-bottom: 20px; /* Espaço entre a logo e a nova animação */
    }

    @keyframes tb-pulse-animation {
      0% {
        transform: scale(1);
        opacity: 0.8;
      }
      50% {
        transform: scale(1.05);
        opacity: 1;
      }
      100% {
        transform: scale(1);
        opacity: 0.8;
      }
    }

    /* From Uiverse.io by kerolos23 - Adaptado para o tema */
    .loader {
      display: inline-block;
      position: relative;
      width: 80px;
      height: 80px;
    }

    .loader div {
      position: absolute;
      top: 33px;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #f5f5f5; /* Cor branco gelo */
      animation-timing-function: cubic-bezier(0, 1, 1, 0);
    }

    .loader div:nth-child(1) {
      left: 8px;
      animation: flip1 0.6s infinite;
    }

    .loader div:nth-child(2) {
      left: 8px;
      animation: flip2 0.6s infinite;
    }

    .loader div:nth-child(3) {
      left: 32px;
      animation: flip2 0.6s infinite;
    }

    .loader div:nth-child(4) {
      left: 56px;
      animation: flip3 0.6s infinite;
    }

    @keyframes flip1 {
      0% {
        transform: scale(0);
      }
      100% {
        transform: scale(1);
      }
    }

    @keyframes flip3 {
      0% {
        transform: scale(1);
      }
      100% {
        transform: scale(0);
      }
    }

    @keyframes flip2 {
      0% {
        transform: translate(0, 0);
      }
      100% {
        transform: translate(24px, 0);
      }
    }

  </style>
