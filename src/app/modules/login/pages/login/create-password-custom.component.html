<!-- Página personalizada de criação de senha -->
<div class="tb-create-password-custom mat-app-background flex flex-row items-center justify-center w-full p-4">
  <mat-card appearance="outlined" class="max-w-md w-full">
    <mat-card-header class="bg-primary text-white">
      <mat-card-title class="text-xl font-medium">
        {{ 'login.create-password' | translate }}
      </mat-card-title>
    </mat-card-header>

    <mat-card-content class="p-6 flex flex-col gap-4">
      <form [formGroup]="createPassword" (ngSubmit)="onCreatePassword()" class="flex flex-col gap-4">
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>{{ 'common.password' | translate }}</mat-label>
          <input matInput type="password" formControlName="password" autofocus>
          <mat-icon matPrefix>lock</mat-icon>
          <tb-toggle-password matSuffix></tb-toggle-password>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
          <mat-label>{{ 'login.password-again' | translate }}</mat-label>
          <input matInput type="password" formControlName="password2">
          <mat-icon matPrefix>lock</mat-icon>
          <tb-toggle-password matSuffix></tb-toggle-password>
        </mat-form-field>

        <div class="flex flex-col sm:flex-row justify-center gap-4 mt-2">
          <button mat-raised-button color="primary" type="submit">
            {{ 'login.create-password' | translate }}
          </button>
          <button mat-stroked-button type="button" routerLink="/login">
            {{ 'action.cancel' | translate }}
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
